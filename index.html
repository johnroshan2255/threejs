<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>my-three-app</title>
  </head>
  <body>
    <div id="loading-screen" aria-live="polite">
      <div class="loading-screen__inner">
        <p class="loading-screen__title">Open Field</p>
        <p id="loading-status" class="loading-screen__status">Starting…</p>
        <div id="loading-progress" class="loading-progress">
          <div
            id="loading-bar"
            class="loading-progress__bar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ></div>
        </div>
        <button id="start-game-btn" class="start-game-btn" type="button" hidden>
          Start Game
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
